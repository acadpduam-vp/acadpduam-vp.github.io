    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f5; margin: 0; padding: 20px; }
        .header { margin-bottom: 40px; border-bottom: 3px solid #003366; padding-bottom: 15px; display: flex; align-items: center; }
        .header img.logo { width: 60px; height: auto; border-radius: 50%; margin-right: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header h1 { margin: 0; color: #003366; font-size: 26px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        
        /* Grid Layout */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 25px; }
        
        /* The 3D Buttons */
        .file-btn { 
            background: linear-gradient(145deg, #ffffff 0%, #f0f0f0 100%);
            border: 1px solid #d1d9e6; 
            border-radius: 12px; 
            padding: 20px 10px; 
            text-align: center; 
            text-decoration: none; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1), -4px -4px 10px rgba(255,255,255,0.8), inset 1px 1px 2px rgba(255,255,255,0.9);
            transition: all 0.2s ease-in-out;
        }
        
        /* 3D Press-down effect when hovering/clicking */
        .file-btn:hover { 
            transform: translateY(3px); 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1), -2px -2px 5px rgba(255,255,255,0.8), inset 1px 1px 2px rgba(255,255,255,0.9); 
            border-color: #add8e6;
        }
        
        /* The 3D Image Icons */
        .icon-img { width: 55px; height: 55px; margin-bottom: 12px; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.15)); transition: transform 0.2s; }
        .file-btn:hover .icon-img { transform: scale(1.05); }
        
        /* Text formatting */
        .file-name { font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    </style>
</head>
